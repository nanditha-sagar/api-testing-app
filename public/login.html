<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register - API Testing App</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        margin: 0;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 12px;
        width: 350px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        transition: all 0.3s ease;
      }

      .card h2 {
        margin-top: 0;
        margin-bottom: 24px;
        color: #1e3c72;
        text-align: center;
        font-size: 28px;
        font-weight: 700;
      }

      .tabs {
        display: flex;
        justify-content: space-around;
        margin-bottom: 24px;
        border-bottom: 2px solid #e0e0e0;
      }

      .tab {
        padding: 10px 20px;
        cursor: pointer;
        font-weight: 600;
        color: #666;
        transition: all 0.3s ease;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
      }

      .tab.active {
        color: #007bff;
        border-bottom-color: #007bff;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #444;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        transition: border-color 0.3s ease;
      }

      input:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
      }

      button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #007bff, #0056b3);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: background 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      button:hover {
        background: linear-gradient(to right, #0056b3, #004085);
      }

      .alert {
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-size: 14px;
        display: none;
        text-align: center;
      }

      .alert-danger {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>API Tester</h2>

      <div class="tabs">
        <div id="tab-login" class="tab active" onclick="switchTab('login')">Login</div>
        <div id="tab-register" class="tab" onclick="switchTab('register')">Register</div>
      </div>

      <div id="alertBox" class="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required />
        </div>
        <button type="submit">Create Account</button>
      </form>
    </div>

    <script>
      let currentMode = 'login';

      function showAlert(message, type = 'danger') {
        const alertBox = document.getElementById("alertBox");
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type}`;
        alertBox.style.display = "block";
      }

      function hideAlert() {
        const alertBox = document.getElementById("alertBox");
        alertBox.style.display = "none";
      }

      function switchTab(mode) {
        currentMode = mode;
        hideAlert();

        const loginTab = document.getElementById("tab-login");
        const registerTab = document.getElementById("tab-register");
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");

        if (mode === 'login') {
          loginTab.classList.add("active");
          registerTab.classList.remove("active");
          loginForm.style.display = "block";
          registerForm.style.display = "none";
        } else {
          loginTab.classList.remove("active");
          registerTab.classList.add("active");
          loginForm.style.display = "none";
          registerForm.style.display = "block";
        }
      }

      async function handleLogin(event) {
        event.preventDefault();
        hideAlert();

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            showAlert(data.message || "Failed to log in");
            return;
          }

          localStorage.setItem("userName", data.user.name);
          localStorage.setItem("userEmail", data.user.email);
          window.location.href = "/index.html";
        } catch (error) {
          showAlert("An error occurred during login. Please try again.");
          console.error(error);
        }
      }

      async function handleRegister(event) {
        event.preventDefault();
        hideAlert();

        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const password = document.getElementById("regPassword").value;

        if (!name) {
          showAlert("Please enter your name");
          return;
        }

        try {
          const response = await fetch("/api/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name, email, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            showAlert(data.message || "Registration failed");
            return;
          }

          showAlert("Registration successful! You can now log in.", "success");
          setTimeout(() => {
            switchTab('login');
            document.getElementById("loginEmail").value = email;
          }, 1500);
        } catch (error) {
          showAlert("An error occurred during registration. Please try again.");
          console.error(error);
        }
      }
    </script>
  </body>
</html>
